<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI QA Agent</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/browser-select.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape circle1"></div>
        <div class="shape circle2"></div>
        <div class="shape circle3"></div>
    </div>

    <div class="app-container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="10 8 16 12 10 16 10 8"></polygon>
                </svg>
                <h1>QA <span>Agent</span></h1>
            </div>
            <p class="subtitle">AI-powered autonomous functional testing for Web Apps.</p>
        </header>

        <main>
            <div class="glass-panel input-section">
                <h2>Target URL</h2>
                <div class="input-group">
                    <input type="url" id="url-input" placeholder="https://practicetestautomation.com/practice-test-login/" value="https://practicetestautomation.com/practice-test-login/">
                    
                    <!-- Custom dropdown that looks like a button -->
                    <div class="browser-select-wrapper">
                        <button type="button" class="browser-select-btn" id="browser-select-btn">
                            <span class="selected-label">Chrome</span>
                            <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m6 9 6 6 6-6"/>
                            </svg>
                        </button>
                        <div class="browser-dropdown hidden" id="browser-dropdown">
                            <button type="button" class="dropdown-option active" data-value="chromium">Chrome</button>
                            <button type="button" class="dropdown-option" data-value="brave">Brave</button>
                            <button type="button" class="dropdown-option" data-value="firefox">Firefox</button>
                        </div>
                    </div>
                    
                    <button id="run-btn" class="run-btn">
                        <span class="btn-text">Run tests</span>
                        <div class="spinner hidden"></div>
                    </button>
                </div>
                <div class="agent-status" id="agent-status">Ready to initialize.</div>
            </div>

            <!-- Live logs panel -->
            <div class="glass-panel logs-panel hidden" id="logs-panel">
                <div class="logs-header">
                    <h2>Live Logs</h2>
                    <button class="clear-logs-btn" id="clear-logs-btn">Clear</button>
                </div>
                <div class="logs-content" id="logs-content">
                    <!-- Dynamic logs -->
                </div>
            </div>

            <div class="glass-panel results-section hidden" id="results-panel">
                <div class="results-header">
                    <h2>Test Report</h2>
                    <button id="export-word-btn" class="export-word-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span>Télécharger Word</span>
                    </button>
                </div>

                <div class="metrics">
                    <div class="metric total"><span id="metric-total">0</span> Total</div>
                    <div class="metric passed"><span id="metric-passed">0</span> Passed</div>
                    <div class="metric failed"><span id="metric-failed">0</span> Failed</div>
                </div>

                <div class="test-list" id="test-list">
                    <!-- Dynamic test cases -->
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
